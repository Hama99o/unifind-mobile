# 04-signin-sheet.yaml — SignInSheet appears for protected actions.
#
# Validates:
#   - Tapping the Profile tab when logged out shows the sign-in prompt.
#   - "Sign In" button is present.
#   - "Create Account" button is present.
#
# Note: this flow assumes the user is NOT logged in (fresh install / cleared state).
# testIDs: tab-profile, profile-gate-signin, profile-gate-create-account,
#          signin-sheet-signin, signin-sheet-create-account

appId: org.unifind.app
tags:
  - auth
  - signin
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 5000

# Navigate to Profile (triggers sign-in sheet when logged out)
- tapOn:
    id: tab-profile
- waitForAnimationToEnd:
    timeout: 3000

# Logged out: Profile shows an inline "Sign-In Required" gate. Its Sign In
# button opens the global SignInSheet (Sign In + Create Account).
- assertVisible:
    id: profile-gate-signin
- assertVisible:
    id: profile-gate-create-account
- tapOn:
    id: profile-gate-signin
- waitForAnimationToEnd
- assertVisible:
    id: signin-sheet-signin
- assertVisible:
    id: signin-sheet-create-account
# Dismiss without signing in
- back
